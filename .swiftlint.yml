# SwiftLint Configuration for Caishen

# Paths to include during linting
included:
  - Pod/Classes

# Paths to exclude during linting
excluded:
  - Carthage
  - Pods
  - Example/Pods
  - vendor

# Rules to disable
disabled_rules:
  - trailing_whitespace

# Rules to enable
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 100

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
  excluded:
    - id
    - i
    - j
    - k

cyclomatic_complexity:
  warning: 15
  error: 25

# Custom reporter
reporter: "xcode"
